worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 valid=30s;

    server {
        listen 443 ssl;
        server_name nmatondo.42.fr;
    
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /var/www/html;
        index index.php index.html index.htm;

        location / {
            set $_frontend_proxy "frontend:80";
            rewrite ^/(.*) /$1 break;
            proxy_pass http://_frontend_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            error_page 502 503 504 = /service-unavailable.html;
        }

        location /adminer/ {
            set $_adminer_proxy "adminer:8080";
            rewrite ^/(.*) /$1 break;
            proxy_pass http://_adminer_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            error_page 502 503 504 = /service-unavailable.html;
        }

        location /grafana/ {
            set $_grafana_proxy "grafana:3001";
            rewrite ^/(.*) /$1 break;
            proxy_pass http://_grafana_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            error_page 502 503 504 = /service-unavailable.html;
        }

        location = /service-unavailable.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
