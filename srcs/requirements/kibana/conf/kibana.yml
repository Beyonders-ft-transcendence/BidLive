server.host: "0.0.0.0"
server.port: 5601
server.basePath: "/kibana"
server.rewriteBasePath: true
server.publicBaseUrl: "https://bidlive.42.fr/kibana"

elasticsearch.hosts: ["https://elasticsearch:9200"]

# Disable telemetry
telemetry.optIn: false
telemetry.allowChangingOptInStatus: false

# Elasticsearch connection (set via env vars in entrypoint)
elasticsearch.username: "${ELASTICSEARCH_USERNAME}"
elasticsearch.password: "${ELASTICSEARCH_PASSWORD}"

# Encryption Keys (min 32 characters)
xpack.encryptedSavedObjects.encryptionKey: "bidlive_encryption_key_for_saved_objects_must_be_32_bytes_at_least"
xpack.security.encryptionKey: "bidlive_encryption_key_for_security_must_be_32_bytes_at_least"
xpack.reporting.encryptionKey: "bidlive_encryption_key_for_reporting_must_be_32_bytes_at_least"
