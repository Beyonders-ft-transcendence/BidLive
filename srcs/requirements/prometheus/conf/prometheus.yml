global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "backend"
    metrics_path: "/metrics/"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "livekit"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["livekit:6789"]

  - job_name: "postgres-exporter"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis-exporter"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "nginx-exporter"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["nginx-exporter:9113"]
