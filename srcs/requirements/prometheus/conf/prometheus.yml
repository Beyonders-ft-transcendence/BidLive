global:
  scrape_interval: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - scheme: https
      tls_config:
        insecure_skip_verify: true
      static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "backend"
    metrics_path: "/metrics/"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"

  - job_name: "livekit"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["livekit:6789"]
        labels:
          region: "local"

  - job_name: "postgres_exporter"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: "redis-exporter"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          kubernetes_namespace: "bidlive"
          statefulset_kubernetes_io_pod_name: "redis-0"

  - job_name: "nginx_exporter"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["nginx_exporter:9113"]
        labels:
          namespace: "bidlive"
          app: "nginx"

  - job_name: "celery-exporter"
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["celery-exporter:9808"]
