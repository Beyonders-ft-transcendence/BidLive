input {
  # Receive logs from ALL containers via Docker GELF logging driver
  gelf {
    port => 12201
    type => "docker"
  }

  # Receive structured JSON logs from Django backend via TCP
  tcp {
    port => 5000
    codec => json_lines
    type => "django-app"
  }
}

filter {
  # Add processing metadata
  mutate {
    add_field => { "environment" => "development" }
    add_field => { "project"     => "bidlive" }
  }

  # -------------------------------------------------------
  # FIX CRÍTICO: Renomear 'host' (string vinda do GELF) para
  # 'source_host' de modo a evitar conflito com o mapeamento
  # ECS v8 do Elasticsearch 8.x onde 'host' é um objeto.
  # Este mutate aplica-se a TODOS os eventos.
  # -------------------------------------------------------
  if [host] {
    mutate {
      rename => { "host" => "source_host" }
    }
  }

  # -------------------------------------------------------
  # GELF Docker logs: normalizar nomes dos campos
  # O driver GELF do Docker pode enviar os campos com ou sem
  # o prefixo underscore consoante a versão.
  # -------------------------------------------------------
  if [type] == "docker" {
    if [_container_name] {
      mutate { rename => { "_container_name" => "container_name" } }
    }
    if [_tag] {
      mutate { rename => { "_tag" => "tag" } }
    }
    if [_image_name] {
      mutate { rename => { "_image_name" => "image_name" } }
    }
    if [_container_id] {
      mutate { rename => { "_container_id" => "container_id" } }
    }
    if [_image_id] {
      mutate { rename => { "_image_id" => "image_id" } }
    }

    # Mapear nível numérico GELF para string legível
    # Usar 'source' e 'target' (substitutos dos deprecated 'field' e 'destination')
    if [level] {
      translate {
        source     => "level"
        target     => "log_level"
        dictionary => {
          "0" => "EMERGENCY"
          "1" => "ALERT"
          "2" => "CRITICAL"
          "3" => "ERROR"
          "4" => "WARNING"
          "5" => "NOTICE"
          "6" => "INFO"
          "7" => "DEBUG"
        }
        fallback => "UNKNOWN"
      }
    }
  }

  # -------------------------------------------------------
  # Django structured logs (TCP): normalizar campos
  # -------------------------------------------------------
  if [type] == "django-app" {
    if [level] {
      mutate {
        rename => { "level" => "log_level" }
      }
    }
    if [request_id] {
      mutate {
        add_tag => ["has_request_id"]
      }
    }
    if ![service_name] {
      mutate {
        add_field => { "service_name" => "django-backend" }
      }
    }
  }

  # -------------------------------------------------------
  # Parsear logs de acesso do Nginx
  # -------------------------------------------------------
  if [tag] =~ /nginx/ or [container_name] =~ /nginx/ {
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{DATA:user} \[%{HTTPDATE:log_timestamp}\] \"%{WORD:http_method} %{URIPATHPARAM:request_uri} HTTP/%{NUMBER:http_version}\" %{NUMBER:response_code} %{NUMBER:body_bytes_sent} \"%{DATA:referrer}\" \"%{DATA:user_agent}\"'
      }
      tag_on_failure => ["_nginx_parse_failure"]
    }
  }

  # -------------------------------------------------------
  # Parsear logs do Django/Gunicorn via GELF
  # -------------------------------------------------------
  if ([tag] =~ /backend|django/ or [container_name] =~ /backend|django/) and [type] == "docker" {
    grok {
      match => {
        "message" => '%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level_parsed} %{DATA:logger_name} %{GREEDYDATA:log_message}'
      }
      tag_on_failure => ["_django_parse_failure"]
    }
  }

  # -------------------------------------------------------
  # Remover campos internos do GELF que não são necessários
  # ou que causam conflitos de mapeamento ECS
  # -------------------------------------------------------
  mutate {
    remove_field => ["_facility", "_source_realtime_timestamp", "facility", "facility_label"]
  }
}

output {
  elasticsearch {
    hosts    => ["https://elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["/run/secrets/ca_cert"]
    index              => "bidlive-logs-%{+YYYY.MM.dd}"
    ilm_enabled        => true
    ilm_rollover_alias => "bidlive-logs"
    ilm_pattern        => "{now/d}-000001"
    ilm_policy         => "bidlive-retention-policy"
  }
}
