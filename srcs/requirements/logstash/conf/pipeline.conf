input {
  # Receive logs from ALL containers via Docker GELF logging driver
  gelf {
    port => 12201
    type => "docker"
  }

  # Receive structured JSON logs from Django backend via TCP
  tcp {
    port => 5000
    codec => json_lines
    type => "django-app"
  }
}

filter {
  # Add processing metadata
  mutate {
    add_field => { "environment" => "development" }
    add_field => { "project" => "bidlive" }
  }

  # For GELF Docker logs: normalize field names
  if [type] == "docker" {
    # Docker GELF driver sends container info in these fields
    if [_container_name] {
      mutate {
        rename => { "_container_name" => "service_name" }
      }
    }
    if [_tag] {
      mutate {
        rename => { "_tag" => "container_tag" }
      }
    }
    if [_image_name] {
      mutate {
        rename => { "_image_name" => "container_image" }
      }
    }
    if [_container_id] {
      mutate {
        rename => { "_container_id" => "container_id" }
      }
    }
    # Map GELF level to human-readable
    if [level] {
      translate {
        field => "level"
        destination => "log_level"
        dictionary => {
          "0" => "EMERGENCY"
          "1" => "ALERT"
          "2" => "CRITICAL"
          "3" => "ERROR"
          "4" => "WARNING"
          "5" => "NOTICE"
          "6" => "INFO"
          "7" => "DEBUG"
        }
        fallback => "UNKNOWN"
      }
    }
  }

  # For Django structured logs: normalize fields
  if [type] == "django-app" {
    if [level] {
      mutate {
        rename => { "level" => "log_level" }
      }
    }
    if [request_id] {
      mutate {
        add_tag => ["has_request_id"]
      }
    }
    # Add service name for consistency
    if ![service_name] {
      mutate {
        add_field => { "service_name" => "django-backend" }
      }
    }
  }

  # Parse Nginx access log lines for additional fields
  if [service_name] =~ /nginx/ {
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{DATA:user} \[%{HTTPDATE:timestamp}\] "%{WORD:http_method} %{URIPATHPARAM:request_uri} HTTP/%{NUMBER:http_version}" %{NUMBER:response_code} %{NUMBER:body_bytes_sent} "%{DATA:referrer}" "%{DATA:user_agent}"'
      }
      tag_on_failure => ["_nginx_parse_failure"]
    }
  }

  # Parse Django/Gunicorn log lines
  if [service_name] =~ /backend|django/ and [type] == "docker" {
    grok {
      match => {
        "message" => '%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{DATA:logger_name} %{GREEDYDATA:log_message}'
      }
      tag_on_failure => ["_django_parse_failure"]
    }
  }

  # Remove internal GELF fields that are not needed
  mutate {
    remove_field => ["_facility", "_source_realtime_timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/run/secrets/ca_cert"]
    index => "bidlive-logs-%{+YYYY.MM.dd}"
    ilm_enabled => true
    ilm_rollover_alias => "bidlive-logs"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "bidlive-retention-policy"
  }
}
