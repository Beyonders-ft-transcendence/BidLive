<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BidLive — A processar login...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #a1a1aa;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 40px 48px;
      text-align: center;
      max-width: 380px;
      width: 90%;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #27272a;
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { color: #fafafa; font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    p  { font-size: 13px; color: #71717a; line-height: 1.5; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1 id="title">A processar login...</h1>
    <p id="message">Aguarde enquanto terminamos de autenticar a sua conta.</p>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code  = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const title = document.getElementById('title');
      const msg   = document.getElementById('message');

      // Wait a moment so the redirect is visually registered
      setTimeout(function () {
        if (error) {
          title.textContent = 'Login recusado';
          title.className = 'error';
          msg.textContent = decodeURIComponent(error) || 'O provedor OAuth rejeitou o pedido.';
          // Still notify opener of failure
          notifyOpener({ type: 'OAUTH_ERROR', error: error });
          return;
        }

        if (!code) {
          title.textContent = 'Código não recebido';
          title.className = 'error';
          msg.textContent = 'O provider OAuth não retornou um código de autorização.';
          return;
        }

        // Notify opener window with the OAuth code + state
        notifyOpener({ type: 'OAUTH_CODE', code: code, state: state || '' });
      }, 600);
    })();

    function notifyOpener(payload) {
      if (window.opener) {
        window.opener.postMessage(payload, window.location.origin);
        window.close();
      } else {
        document.getElementById('message').textContent =
          'Impossível comunicar com a janela original. Feche esta aba.';
      }
    }
  </script>
</body>
</html>
